<header class="navbar">
  <a routerLink="/" class="logo" aria-label="Click and Pick, accueil">
    <span class="logo-mark">C<span>&amp;</span>P</span>
    <span>Click<span class="logo-accent">&amp;</span>Pick</span>
  </a>

  <label class="search-box">
    <span aria-hidden="true">⌕</span>
    <input type="search" aria-label="Rechercher un restaurant" placeholder="Rechercher un restaurant..." (input)="onSearch($event)">
  </label>

  <nav class="nav-links" aria-label="Navigation principale">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Accueil</a>
    <a routerLink="/liste-restaurant" routerLinkActive="active">Restaurants</a>
    <a routerLink="/" fragment="how-it-works">Comment ça marche</a>
  </nav>

  <div class="nav-actions">
    <a routerLink="/panier" class="cart-link" aria-label="Mon panier">
      🛒 <span>Panier<ng-container *ngIf="panier.nombreArticles() > 0"> ({{ panier.nombreArticles() }})</ng-container></span>
    </a>

    <ng-container *ngIf="utilisateur$ | async as utilisateur; else visiteur">
      <a *ngIf="utilisateur.role === 'RESTAURATEUR'" routerLink="/int-res" class="login-link">Mon espace</a>
      <a href="#" class="login-link" (click)="deconnexion(); $event.preventDefault()">Déconnexion</a>
    </ng-container>
    <ng-template #visiteur>
      <a routerLink="/auth" class="login-link">Connexion</a>
    </ng-template>
  </div>
</header>
