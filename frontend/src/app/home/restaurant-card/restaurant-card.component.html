<article class="restaurant-card">
  <div class="card-image">
    <img *ngIf="restaurant.imageUrl" [src]="restaurant.imageUrl" [alt]="'Photo de ' + restaurant.nom" loading="lazy">
    <span *ngIf="!restaurant.imageUrl" class="initials">{{ initiales }}</span>
  </div>
  <div class="card-content">
    <div class="card-title-row">
      <h3>{{ restaurant.nom }}</h3>
      <span class="rating">★ {{ restaurant.rate | number:'1.1-1' }}</span>
    </div>
    <p class="card-meta">{{ restaurant.categorie }} <span>·</span> {{ restaurant.adresse }}</p>
    <div class="card-bottom">
      <span class="prep-time" *ngIf="restaurant.telephone">☎ {{ restaurant.telephone }}</span>
      <a [routerLink]="['/menu', restaurant.id]" class="menu-link">Voir le menu <span>→</span></a>
    </div>
  </div>
</article>
