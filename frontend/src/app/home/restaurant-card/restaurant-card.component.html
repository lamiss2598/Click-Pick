<article class="card">
  <div class="card__image" [style.background]="restaurant.color">{{ initials }}</div>
  <div class="card__body">
    <h3>{{ restaurant.name }}</h3>
    <p class="card__meta">{{ restaurant.category }} · {{ restaurant.area }}</p>
    <p class="card__info">
      <b>★ {{ restaurant.rating }}</b>
      <span
        class="status"
        [class.status--open]="restaurant.status === 'Ouvert'"
        [class.status--new]="restaurant.status === 'Nouveau'"
      >
        {{ restaurant.status }}
      </span>
      <span>{{ restaurant.prepTime }}</span>
    </p>
  </div>
</article>
