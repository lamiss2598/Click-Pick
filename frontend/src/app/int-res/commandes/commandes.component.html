<div class="commandes-container">

  <div class="page-header">
    <h2>Gestion des commandes</h2>
    <p>Consultez et gérez les commandes de vos clients.</p>
  </div>

  <div class="commandes-card">

    <table>
      <thead>
        <tr>
          <th>N°</th>
          <th>Client</th>
          <th>Produit</th>
          <th>Quantité</th>
          <th>Prix</th>
          <th>Date</th>
          <th>Paiement</th>
          <th>Statut</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let c of commandes">

          <td>#{{c.id}}</td>
          <td>{{c.client}}</td>
          <td>{{c.produit}}</td>
          <td>{{c.quantite}}</td>
          <td>{{c.prix}} DT</td>
          <td>{{c.date}} à {{c.heure}}</td>

          <td>
            <span
              class="paiement"
              [class.paye]="c.paiement === 'Payé'"
              [class.non-paye]="c.paiement === 'Non payé'">
              {{c.paiement}}
            </span>
          </td>

          <td>
            <span class="statut">{{c.statut}}</span>
          </td>

          <td>
            <select
              [value]="c.statut"
              (change)="changerStatut(c, $any($event.target).value)">

              <option value="En attente">En attente</option>
              <option value="En préparation">En préparation</option>
              <option value="Prête">Prête</option>
              <option value="Récupérée">Récupérée</option>

            </select>
          </td>

        </tr>
      </tbody>
    </table>

  </div>

</div>
