spring.application.name=click-pick-backend
server.port=8081

# --- Variables d'environnement : fichier .env (optionnel, non versionné) ---
spring.config.import=optional:file:.env[.properties]

# --- Base Oracle (schéma créé par database/01_schema_11g.sql, donc Hibernate ne touche pas au schéma) ---
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XE}
spring.datasource.username=${DB_USER:CLICKPICK}
spring.datasource.password=${DB_PASSWORD:ClickPick2026}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Sécurité ---
clickpick.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
clickpick.jwt.expiration-minutes=480
clickpick.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# --- Créneaux de retrait générés automatiquement quand un restaurant n'en a pas pour un jour ---
clickpick.timezone=Africa/Tunis
clickpick.creneaux.ouverture=11:00
clickpick.creneaux.fermeture=21:00
clickpick.creneaux.pas-minutes=60
clickpick.creneaux.capacite=5
clickpick.creneaux.jours-a-l-avance=7
